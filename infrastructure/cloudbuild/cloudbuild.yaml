# =============================================================================
# Cloud Build CI/CD Pipeline for AI Accountant
# =============================================================================
# Triggers: Push to main branch or manual trigger
#
# Pipeline stages:
# 1. Build backend image
# 2. Build AI worker image
# 3. Push to Artifact Registry
# 4. Run database migrations
# 5. Deploy to Cloud Run
#
# Usage:
#   gcloud builds submit --config infrastructure/cloudbuild/cloudbuild.yaml .

substitutions:
  _REGION: australia-southeast1
  _ARTIFACT_REGISTRY: ${_REGION}-docker.pkg.dev/${PROJECT_ID}/ai-accountant
  _BACKEND_SERVICE: ai-accountant-backend
  _WORKER_JOB: ai-accountant-worker
  _CLOUD_SQL_INSTANCE: ${PROJECT_ID}:${_REGION}:ai-accountant-db

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamic_substitutions: true

steps:
  # ===========================================================================
  # Stage 1: Build Backend Image
  # ===========================================================================
  - id: 'build-backend'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --cache-from ${_ARTIFACT_REGISTRY}/${_BACKEND_SERVICE}:latest \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t ${_ARTIFACT_REGISTRY}/${_BACKEND_SERVICE}:${SHORT_SHA} \
          -t ${_ARTIFACT_REGISTRY}/${_BACKEND_SERVICE}:latest \
          -f Dockerfile \
          .
    env:
      - 'DOCKER_BUILDKIT=1'

  # ===========================================================================
  # Stage 2: Build AI Worker Image
  # ===========================================================================
  - id: 'build-ai-worker'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker build \
          --cache-from ${_ARTIFACT_REGISTRY}/${_WORKER_JOB}:latest \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          -t ${_ARTIFACT_REGISTRY}/${_WORKER_JOB}:${SHORT_SHA} \
          -t ${_ARTIFACT_REGISTRY}/${_WORKER_JOB}:latest \
          -f Dockerfile.ai-worker \
          .
    env:
      - 'DOCKER_BUILDKIT=1'
    waitFor: ['-']  # Run in parallel with backend build

  # ===========================================================================
  # Stage 3: Push Backend Image to Artifact Registry
  # ===========================================================================
  - id: 'push-backend'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/${_BACKEND_SERVICE}'
    waitFor: ['build-backend']

  # ===========================================================================
  # Stage 4: Push AI Worker Image to Artifact Registry
  # ===========================================================================
  - id: 'push-ai-worker'
    name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - '${_ARTIFACT_REGISTRY}/${_WORKER_JOB}'
    waitFor: ['build-ai-worker']

  # ===========================================================================
  # Stage 5: Run Database Migrations
  # ===========================================================================
  - id: 'run-migrations'
    name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Run migrations using the backend image with Cloud SQL proxy
        docker run --rm \
          --network cloudbuild \
          -e DATABASE_URL=$$DATABASE_URL \
          ${_ARTIFACT_REGISTRY}/${_BACKEND_SERVICE}:${SHORT_SHA} \
          npx drizzle-kit migrate
    secretEnv: ['DATABASE_URL']
    waitFor: ['push-backend']

  # ===========================================================================
  # Stage 6: Deploy Backend to Cloud Run
  # ===========================================================================
  - id: 'deploy-backend'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_BACKEND_SERVICE}'
      - '--image=${_ARTIFACT_REGISTRY}/${_BACKEND_SERVICE}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--min-instances=0'
      - '--max-instances=10'
      - '--concurrency=80'
      - '--timeout=300'
      - '--set-cloudsql-instances=${_CLOUD_SQL_INSTANCE}'
      - '--set-env-vars=NODE_ENV=production,ENABLE_RAG=true,ENABLE_AGENTS=true'
      - '--set-secrets=OPENAI_API_KEY=openai-api-key:latest,OPENROUTER_API_KEY=openrouter-api-key:latest,JWT_SECRET=jwt-secret:latest,DATABASE_URL=database-url:latest'
      - '--cpu-boost'
      - '--execution-environment=gen2'
      - '--service-account=${_BACKEND_SERVICE}@${PROJECT_ID}.iam.gserviceaccount.com'
    waitFor: ['run-migrations']

  # ===========================================================================
  # Stage 7: Deploy AI Worker as Cloud Run Job
  # ===========================================================================
  - id: 'deploy-ai-worker'
    name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'deploy'
      - '${_WORKER_JOB}'
      - '--image=${_ARTIFACT_REGISTRY}/${_WORKER_JOB}:${SHORT_SHA}'
      - '--region=${_REGION}'
      - '--cpu=2'
      - '--memory=2Gi'
      - '--task-timeout=600'
      - '--max-retries=1'
      - '--parallelism=1'
      - '--set-cloudsql-instances=${_CLOUD_SQL_INSTANCE}'
      - '--set-secrets=OPENAI_API_KEY=openai-api-key:latest,OPENROUTER_API_KEY=openrouter-api-key:latest,DATABASE_URL=database-url:latest,LANGFUSE_PUBLIC_KEY=langfuse-public-key:latest,LANGFUSE_SECRET_KEY=langfuse-secret-key:latest'
      - '--service-account=${_WORKER_JOB}@${PROJECT_ID}.iam.gserviceaccount.com'
    waitFor: ['push-ai-worker']

  # ===========================================================================
  # Stage 8: Verify Deployment Health
  # ===========================================================================
  - id: 'verify-deployment'
    name: 'gcr.io/cloud-builders/curl'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        # Get the Cloud Run service URL
        SERVICE_URL=$(gcloud run services describe ${_BACKEND_SERVICE} \
          --region=${_REGION} \
          --format='value(status.url)')

        # Wait for service to be ready
        echo "Verifying deployment at $${SERVICE_URL}/health..."

        for i in {1..30}; do
          if curl -sf "$${SERVICE_URL}/health" > /dev/null; then
            echo "Deployment verified successfully!"
            exit 0
          fi
          echo "Attempt $i/30 - waiting for service to be ready..."
          sleep 10
        done

        echo "Deployment verification failed!"
        exit 1
    waitFor: ['deploy-backend']

# =============================================================================
# Secrets (stored in Secret Manager)
# =============================================================================
availableSecrets:
  secretManager:
    - versionName: projects/${PROJECT_ID}/secrets/database-url/versions/latest
      env: 'DATABASE_URL'

# =============================================================================
# Images to push to Artifact Registry
# =============================================================================
images:
  - '${_ARTIFACT_REGISTRY}/${_BACKEND_SERVICE}:${SHORT_SHA}'
  - '${_ARTIFACT_REGISTRY}/${_BACKEND_SERVICE}:latest'
  - '${_ARTIFACT_REGISTRY}/${_WORKER_JOB}:${SHORT_SHA}'
  - '${_ARTIFACT_REGISTRY}/${_WORKER_JOB}:latest'

# =============================================================================
# Build timeout (15 minutes)
# =============================================================================
timeout: 900s
