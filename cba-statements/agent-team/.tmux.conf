# CBA Agent Team - tmux configuration
# Source this in your tmux session for better display

# Use 256 colors
set -g default-terminal "screen-256color"

# Status bar styling
set -g status-style "bg=#1a1b26,fg=#a9b1d6"
set -g status-left-length 40
set -g status-left "#[fg=#7aa2f7,bold] 🏦 CBA Agent Team #[fg=#565f89]| "
set -g status-right "#[fg=#9ece6a] %H:%M #[fg=#565f89]| #[fg=#bb9af7]%d %b "

# Pane borders
set -g pane-border-style "fg=#3b4261"
set -g pane-active-border-style "fg=#7aa2f7,bold"

# Pane labels
set -g pane-border-format " #{pane_index}: #{pane_title} "
set -g pane-border-status top

# Mouse support for clicking between panes
set -g mouse on

# Increase scrollback buffer
set -g history-limit 50000

# Window titles
set -g set-titles on
set -g set-titles-string "CBA Agent Team - #W"
