version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cba-server
    ports:
      - "3501:3501"
    environment:
      - VITE_OPENAI_API_KEY=${VITE_OPENAI_API_KEY}
      - VITE_OPENROUTER_API_KEY=${VITE_OPENROUTER_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-dev_secret_key_123}
      - PORT=3501
    volumes:
      # Persist SQLite DB
      - ./server/sqlite.db:/app/sqlite.db
      # Persist Statement Files
      - ./statements:/statements
      # Persist Cognee DB (if local)
      - ./server/.cognee:/app/.cognee
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: cba-client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
