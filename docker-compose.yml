# =============================================================================
# GoldLedger — Docker Compose (Neon Cloud + Cognee Cloud)
# =============================================================================
# Services:
#   - redis:    Redis 7 (queue + session caching)
#   - server:   Hono API server (connects to Neon Cloud + Cognee Cloud)
#   - client:   React frontend (nginx with API proxy)
#
# External services (no Docker needed):
#   - Neon Cloud PostgreSQL (NEON_DATABASE_URL)
#   - Cognee Cloud knowledge graph (https://api.cognee.ai)
#
# Usage:
#   docker compose up --build -d
#   Open http://localhost:8080
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Redis — Queue + session caching
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: cba-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - cba-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # CBA Server — Hono API (Node.js)
  # ---------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: cba-server
    restart: unless-stopped
    ports:
      - "3501:3501"
    environment:
      # Server config
      - PORT=3501
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET}
      # Admin auth
      - ADMIN_JWT_SECRET=${ADMIN_JWT_SECRET}
      - ADMIN_DEFAULT_PASSWORD=${ADMIN_DEFAULT_PASSWORD:-Admin123!}
      # Tenant JWT secret must match JWT_SECRET so global middleware can verify tenant tokens
      - TENANT_JWT_SECRET=${JWT_SECRET}
      # AI Keys
      - VITE_OPENAI_API_KEY=${VITE_OPENAI_API_KEY}
      - VITE_OPENROUTER_API_KEY=${VITE_OPENROUTER_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      # Claude Agents
      - USE_CLAUDE_AGENTS=${USE_CLAUDE_AGENTS:-true}
      - CLAUDE_MODEL=${CLAUDE_MODEL:-claude-sonnet-4-5-20250929}
      # Cognee Cloud
      - USE_COGNEE=${USE_COGNEE:-true}
      - COGNEE_API_URL=${COGNEE_API_URL:-https://api.cognee.ai}
      - COGNEE_API_KEY=${COGNEE_API_KEY}
      # Enrichment APIs
      - ABNLOOKUP_GUID=${ABNLOOKUP_GUID}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # Neon Cloud PostgreSQL (primary database)
      - USE_NEON=true
      - NEON_DATABASE_URL=${NEON_DATABASE_URL}
      - NEON_AI_DATABASE_URL=${NEON_AI_DATABASE_URL}
      - NEON_API_KEY=${NEON_API_KEY}
      - NEON_PROJECT_ID=${NEON_PROJECT_ID}
      - NEON_ORG_ID=${NEON_ORG_ID}
      # Redis (queue + caching)
      - REDIS_URL=redis://redis:6379
      # Encryption keys
      - TFN_ENCRYPTION_KEY=${TFN_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - PAYMENT_ENCRYPTION_KEY=${PAYMENT_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - BANK_ENCRYPTION_KEY=${BANK_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - ENCRYPTION_KEY=${BANK_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3501/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    volumes:
      - ./statements:/statements
    networks:
      - cba-network
    depends_on:
      redis:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # CBA Client — React + Nginx (with API proxy to server)
  # ---------------------------------------------------------------------------
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        # Empty = client uses nginx proxy (location /api/ → server:3501)
        VITE_API_URL: ""
    container_name: cba-client
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - cba-network
    depends_on:
      server:
        condition: service_healthy

# =============================================================================
# Volumes
# =============================================================================
volumes:
  redis-data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  cba-network:
    driver: bridge
