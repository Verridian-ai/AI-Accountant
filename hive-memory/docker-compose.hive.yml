# GoldLedger Hive Memory — Local Cognee Stack
# Provides a local high-speed cognee MCP server for agent teams
# Run: docker compose -f hive-memory/docker-compose.hive.yml up -d
#
# Architecture:
#   cognee-backend:8000  — Cognee FastAPI server (knowledge graph engine)
#   cognee-mcp:8001      — MCP server (Claude Code connects here)
#   postgres:5433        — pgvector for embeddings (separate port from app DB)
#   redis:6380           — Cache (separate port from app Redis)
#
# All agent sessions connect via MCP at http://localhost:8001/mcp

version: '3.9'

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # PostgreSQL with pgvector — Cognee's relational + vector store
  # ─────────────────────────────────────────────────────────────────────────────
  hive-postgres:
    image: pgvector/pgvector:pg17
    container_name: hive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hive
      POSTGRES_PASSWORD: hive_memory_2026
      POSTGRES_DB: cognee_hive
    ports:
      - "5433:5432"
    volumes:
      - hive-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hive -d cognee_hive"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # Redis — Cognee session cache
  # ─────────────────────────────────────────────────────────────────────────────
  hive-redis:
    image: redis:7-alpine
    container_name: hive-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - hive-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────────────────────
  # Cognee Backend — Knowledge graph engine
  # ─────────────────────────────────────────────────────────────────────────────
  hive-cognee:
    image: cognee/cognee:main
    container_name: hive-cognee
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # LLM — use OpenRouter with existing setup
      LLM_PROVIDER: openai
      LLM_API_KEY: ${OPENROUTER_API_KEY:-${LLM_API_KEY}}
      LLM_ENDPOINT: https://openrouter.ai/api/v1
      LLM_MODEL: openrouter/anthropic/claude-sonnet-4-5

      # Embeddings — local fastembed (free, fast)
      EMBEDDING_PROVIDER: fastembed
      EMBEDDING_MODEL: BAAI/bge-small-en-v1.5
      EMBEDDING_DIMENSIONS: 384

      # Database
      DB_PROVIDER: postgres
      DB_HOST: hive-postgres
      DB_PORT: 5432
      DB_USER: hive
      DB_PASSWORD: hive_memory_2026
      DB_NAME: cognee_hive

      # Vector store — pgvector
      VECTOR_DB_PROVIDER: pgvector
      VECTOR_DB_HOST: hive-postgres
      VECTOR_DB_PORT: 5432
      VECTOR_DB_USER: hive
      VECTOR_DB_PASSWORD: hive_memory_2026
      VECTOR_DB_NAME: cognee_hive

      # Graph store — Kuzu (embedded, fastest)
      GRAPH_DATABASE_PROVIDER: kuzu

      # Cache
      CACHING: "true"
      CACHE_BACKEND: redis
      CACHE_HOST: hive-redis
      CACHE_PORT: 6379

      # Auth — enabled for multi-agent isolation
      REQUIRE_AUTHENTICATION: "false"
      ENABLE_BACKEND_ACCESS_CONTROL: "false"

    volumes:
      - hive-cognee-data:/app/.cognee_system
      - hive-cognee-storage:/app/data
    depends_on:
      hive-postgres:
        condition: service_healthy
      hive-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/settings"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────────────────────────────────────
  # Cognee MCP Server — Claude Code connects here
  # All agent sessions use: http://localhost:8001/mcp
  # ─────────────────────────────────────────────────────────────────────────────
  hive-mcp:
    image: cognee/cognee-mcp:main
    container_name: hive-mcp
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      TRANSPORT_MODE: http
      API_URL: http://hive-cognee:8000
    depends_on:
      hive-cognee:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  hive-postgres-data:
  hive-redis-data:
  hive-cognee-data:
  hive-cognee-storage:

networks:
  default:
    name: hive-memory-network
