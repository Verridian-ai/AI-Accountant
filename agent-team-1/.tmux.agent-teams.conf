# ============================================================================
# TMUX CONFIG — Claude Code Agent Teams Observability Layout
# Optimized for WSL2 + Windows Terminal
# Place at: ~/.tmux.agent-teams.conf
# Load with: tmux -f ~/.tmux.agent-teams.conf
# ============================================================================

# ── PREFIX ──────────────────────────────────────────────────────────────────
# Change prefix to Ctrl+a (easier than Ctrl+b)
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# ── GENERAL ─────────────────────────────────────────────────────────────────
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g history-limit 50000          # Big scrollback for agent output
set -g buffer-limit 20
set -sg escape-time 0               # No delay on ESC
set -g display-time 4000            # Messages display for 4s
set -g status-interval 2            # Refresh status every 2s
set -g focus-events on
set -g base-index 1                 # Windows start at 1
setw -g pane-base-index 1           # Panes start at 1

# ── MOUSE (CRITICAL for clicking between agent panes) ──────────────────────
set -g mouse on

# ── PANE BORDERS — Color-coded for agent identification ────────────────────
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#00ff87,bold"
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format " #{pane_index}: #T "

# ── STATUS BAR — Agent Teams Dashboard ─────────────────────────────────────
set -g status-position bottom
set -g status-style "bg=#1a1a2e,fg=#e0e0e0"
set -g status-left-length 40
set -g status-right-length 80

# Left: Session name + window count
set -g status-left "#[fg=#00ff87,bg=#1a1a2e,bold] ⚡ AGENT TEAMS #[fg=#888888]│ #S #[fg=#888888]│ "

# Right: Pane count + time + system load
set -g status-right "#[fg=#888888]│ #[fg=#00bfff]Panes: #{window_panes} #[fg=#888888]│ #[fg=#ffcc00]%H:%M:%S #[fg=#888888]│ #[fg=#ff6b6b]%d-%b "

# Window status formatting
set -g window-status-format "#[fg=#666666] #I:#W "
set -g window-status-current-format "#[fg=#00ff87,bg=#2a2a4e,bold] #I:#W "
set -g window-status-separator ""

# ── PANE NAVIGATION — Fast switching between agent views ───────────────────
# Alt+Arrow to switch panes (no prefix needed — fastest for monitoring)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Alt+Number to jump to specific pane
bind -n M-1 select-pane -t 1
bind -n M-2 select-pane -t 2
bind -n M-3 select-pane -t 3
bind -n M-4 select-pane -t 4
bind -n M-5 select-pane -t 5
bind -n M-6 select-pane -t 6

# ── PANE MANAGEMENT ────────────────────────────────────────────────────────
# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Zoom toggle (prefix + z) — fullscreen a single agent pane
# Already default: prefix + z

# Resize panes with Shift+Arrow (hold prefix)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── LAYOUTS — Quick arrangements for agent teams ───────────────────────────
# prefix + T = Tiled (equal size, best for 3-5 agents)
bind T select-layout tiled

# prefix + E = Even-horizontal (side by side)
bind E select-layout even-horizontal

# prefix + V = Even-vertical (stacked)
bind V select-layout even-vertical

# prefix + M = Main-horizontal (leader top, agents bottom)
bind M select-layout main-horizontal

# prefix + W = Main-vertical (leader left, agents right)
bind W select-layout main-vertical

# ── WINDOW MANAGEMENT ─────────────────────────────────────────────────────
# prefix + c = new window
bind c new-window -c "#{pane_current_path}"

# prefix + r = reload config
bind r source-file ~/.tmux.agent-teams.conf \; display "Config Reloaded!"

# ── COPY MODE — Scroll through agent output ────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ── MONITORING — Get notified when agents produce output ───────────────────
setw -g monitor-activity on
set -g visual-activity off           # Don't flash, just highlight in status
setw -g activity-action other

# ── AGENT TEAMS CLEANUP ───────────────────────────────────────────────────
# prefix + X = kill all agent panes (keep pane 1 as leader)
bind X confirm-before -p "Kill all agent panes? (y/n)" "run-shell 'tmux list-panes -F \"#{pane_id}\" | tail -n +2 | xargs -I {} tmux kill-pane -t {}'"

# prefix + Q = kill entire session
bind Q confirm-before -p "Kill agent teams session? (y/n)" kill-session
